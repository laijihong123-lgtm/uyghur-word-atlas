name: Probe authoritative Uyghur vocabulary sources
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/data-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect source dataset API and sample files
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          urls=[
           'https://reciteword.cosoft.org.cn/stardict-iso/stardict-dic/zh_CN/stardict-anatilim-uyghur-chinese_uy-cn-2.4.2.tar.bz2',
           'https://huggingface.co/api/datasets/mustafakali/UyZh-FolkSpeech/tree/main?recursive=true',
           'https://huggingface.co/api/datasets/UyghurReferenceTexts/uyghur-headword-lists/tree/main?recursive=true',
           'https://raw.githubusercontent.com/gheyret/Uyghur-ChineseDictionary/master/1Words_1~3000',
          ]
          for url in urls:
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Uyghur-Atlas-Research/1.0'})
            with urllib.request.urlopen(req, timeout=25) as f:
             content=f.read(1500000)
            print('\nSOURCE',url,'bytes',len(content))
            if 'tar.bz2' in url:
             print('STARDICT_HEADER', repr(content[:60]))
            elif 'tree/main' in url:
             data=json.loads(content)
             print('PATHS',[(x.get('path'),x.get('size')) for x in data[:150]])
            else:
             print('SAMPLE',repr(content[:1000]))
           except Exception as exc: print('ERROR',url,str(exc))
          PY

      - name: Inspect GPL Anatilim archive
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, tempfile,tarfile,os
          urls=[
            'https://raw.githubusercontent.com/colordict/colordict.github.io/master/stardict-anatilim-uyghur-chinese_uy-cn-2.4.2.tar.gz',
            'https://raw.githubusercontent.com/xhacker/chinese-uyghur/master/raw/ChineseUyghurStarDict_UyCn.txt',
          ]
          for u in urls:
           try:
            with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'UyghurAtlas'}),timeout=55) as r:
             body=r.read()
            print('DOWNLOADED',u,len(body))
            if u.endswith('.tar.gz'):
             import io
             tf=tarfile.open(fileobj=io.BytesIO(body),mode='r:gz')
             members=tf.getmembers()
             print('MEMBERS',[(a.name,a.size) for a in members[:20]])
             ifos=[m for m in members if m.name.endswith('.ifo')]
             if ifos: print('IFO',tf.extractfile(ifos[0]).read().decode('utf-8','replace')[:800])
            else:print('TEXT_HEAD',repr(body[:900]))
           except Exception as e: print('EXC',str(e))
          PY

      - name: Inspect 2009 orthography TSV and StarDict entries
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, tarfile,io,struct
          url='https://huggingface.co/datasets/UyghurReferenceTexts/uyghur-headword-lists/resolve/main/data/imla_lughiti_2009/imla_lughiti_2009_headwords.tsv'
          text=urllib.request.urlopen(url,timeout=35).read().decode('utf-8')
          print('ORTHO_LINES',text.splitlines()[:10])
          url='https://raw.githubusercontent.com/colordict/colordict.github.io/master/stardict-anatilim-uyghur-chinese_uy-cn-2.4.2.tar.gz'
          dat=urllib.request.urlopen(url,timeout=45).read()
          t=tarfile.open(fileobj=io.BytesIO(dat),mode='r:gz')
          files={m.name.split('/')[-1]:t.extractfile(m).read() for m in t.getmembers() if m.name.endswith(('.idx','.dict'))}
          idx=next(v for k,v in files.items() if k.endswith('.idx'))
          defs=next(v for k,v in files.items() if k.endswith('.dict'))
          pos=0;out=[]
          for n in range(600):
           end=idx.index(bytes([0]),pos)
           word=idx[pos:end].decode('utf-8','replace')
           offset,size=struct.unpack('>II',idx[end+1:end+9])
           gloss=defs[offset:offset+size].decode('utf-8','replace')
           pos=end+9
           if n<30 or ('ئوقۇ' in word and len(out)<60):out.append((word,gloss[:95]))
          print('STARDICT_SAMPLE',out[:75])
          PY
