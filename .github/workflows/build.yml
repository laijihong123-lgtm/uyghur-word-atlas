name: Build and publish Uyghur Word Atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: uyghur-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Uyghur adaptation
        uses: actions/checkout@v4
      - name: Clone original Word Atlas source without English image/audio library
        shell: bash
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/designfuchen/word-atlas.git upstream
          cd upstream
          git sparse-checkout set --no-cone \
            "/*" "!/*/" "/src/" "/public/" \
            "!/public/atlas/audio/" \
            "!/public/atlas/img/" \
            "!/public/atlas/thumb/" \
            "!/public/atlas/entries/"
          test -s package.json
          test -s public/atlas/index.json
          test -s src/store/session.ts
          echo "Original source commit:"
          git rev-parse HEAD
      - name: Validate and import user-reviewed textbook vocabulary
        shell: bash
        run: |
          python3 tools/port_uyghur.py
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          source=list(csv.DictReader(open('data/textbook_reviewed.tsv',encoding='utf-8-sig'),delimiter='\t'))
          idx=json.loads(Path('upstream/public/atlas/index.json').read_text(encoding='utf-8'))
          entries=[]
          for file in sorted(Path('upstream/public/atlas/entries').glob('*.json'),key=lambda p:int(p.stem)):
            entries.extend(json.loads(file.read_text(encoding='utf-8')))
          assert len(source)==1817 and len(entries)==1813
          assert idx['count']==len(idx['words'])==len(entries)
          expected_by_form={}
          for row in source:
            expected_by_form.setdefault(row['维吾尔语'],[]).append(row['中文释义'])
          from tools.port_uyghur import to_uly
          index_translit={r[0]:r[3] for r in idx['words']}
          for e in entries:
            assert [s['zh'] for s in e['senses']]==expected_by_form[e['w']], (e['w'],e['senses'])
            assert not e['ex'] and e['m']==32
            assert e['uk']==to_uly(e['w'])==index_translit[e['id']], (e['id'],e['w'])
            assert e['us']=='' and e['uk'], e['id']
          deferred=list(csv.DictReader(open('data/textbook_deferred.tsv',encoding='utf-8-sig'),delimiter='\t'))
          assert len(deferred)==4 and all(row['教材词形'] not in expected_by_form for row in deferred)
          # Reordering must never change persistent card IDs / source glosses.
          original_word_positions={}
          for n,row in enumerate(source,1):
            original_word_positions.setdefault(row['维吾尔语'],n)
          assert all(row[0]==f"tb{original_word_positions[row[1]]:04d}" for row in idx['words'])
          assert [w[4] for w in idx['words']]==sorted(w[4] for w in idx['words'])
          counts=[sum(w[4]==lv for w in idx['words']) for lv in range(6)]
          assert counts==[303,302,302,302,302,302], counts
          assert idx['cefr']==[f'第{i}组' for i in range(1,7)]
          assert idx['words'][0][1] in {'مەن','سەن','بىز','ئۇ'}
          assert any(w[1]=='مەن' and w[4]==0 for w in idx['words'])
          me=(Path('upstream/src/pages/Me.tsx').read_text('utf-8'))
          onboarding=(Path('upstream/src/pages/Onboarding.tsx').read_text('utf-8'))
          assert '[5, 10, 15, 20, 30, 100]' in me
          assert '[5, 10, 15, 20, 30, 100]' in onboarding
          assert '"第1组", "入门"' in onboarding
          print('SORTED_LEARNING_PATH',counts,'FIRST_WORDS',[w[1] for w in idx['words'][:12]],flush=True)
          print('Verified source fidelity:',len(source),'source entries,',len(entries),'study cards,',len(deferred),'deferred')
          PY
      - name: Restore licensed illustrations that match textbook definitions
        run: python3 tools/add_illustrations.py
      - name: Add six purpose-made Uyghur vocabulary illustrations
        shell: bash
        run: |
          python3 -m pip install --quiet pillow==11.3.0
          python3 tools/add_generated_scenes.py
      - name: Generate 952 fast consistent word-specific illustrations
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei > /dev/null
          python3 -m pip install --quiet cairosvg==2.8.2
          python3 tools/generate_fast_illustrations.py
      - name: Validate image flags, files, and original content attribution
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('upstream/public/atlas')
          idx=json.loads((root/'index.json').read_text('utf8'))
          assert idx['count']==1813
          mapped=[w for w in idx['words'] if w[6]&1]
          assert len(mapped)==idx['illustrated']
          for row in mapped:
            for name in ('img','thumb'):
              assert (root/name/(row[0]+'.webp')).stat().st_size>(450 if name=='thumb' else 1000)
          assert (root/'image-attributions.json').is_file()
          assert (root/'generated-image-attributions.json').is_file()
          assert (root/'fast-generated-illustrations.json').is_file()
          fast=json.loads((root/'fast-generated-illustrations.json').read_text('utf8'))
          original=json.loads((root/'image-attributions.json').read_text('utf8'))
          special=json.loads((root/'generated-image-attributions.json').read_text('utf8'))
          original_ids={r['word_id'] for r in original['mappings']}
          special_ids=set(special['images'])
          fallback_ids={r['id'] for r in fast['items']}
          assert original['license']=='CC BY 4.0'
          assert len(original_ids)==original['count'] and len(original_ids)>=900, original['count']
          assert len(special_ids)==special['count']
          assert len(fallback_ids)==fast['count']
          assert not (original_ids & special_ids) and not (original_ids & fallback_ids) and not (special_ids & fallback_ids)
          assert len(original_ids|special_ids|fallback_ids)==1813
          assert idx['illustrated']==1813 and len(mapped)==1813
          for i,entry in enumerate(sorted((root/'entries').glob('*.json'),key=lambda p:int(p.stem))):
            import json
            for e in json.loads(entry.read_text('utf8')):
              assert e['m']&1,e['id']
          print('FULL_PICTURE_COVERAGE',len(mapped),'ORIGINAL_AUTHOR_ART',len(original_ids),'SPECIAL_SCENES',len(special_ids),'FAST_FALLBACK',fast['count'],flush=True)
          PY
      - name: Use Python 3.11 for Uyghur speech synthesis
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate authentic-language AI TTS recordings for all 1813 reviewed words
        timeout-minutes: 90
        env:
          UYGHUR_TTS_LIMIT: "1813"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python3 -m pip install --quiet torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet transformers==4.44.2 'numpy<2'
          python3 tools/generate_mms_audio.py
      - name: Require all 1813 MP3 files and correct audio flags before deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path('upstream/public/atlas')
          idx = json.loads((root/'index.json').read_text('utf-8'))
          assert idx['count'] == 1813 and idx['voiced'] == 1813, (idx['count'],idx['voiced'])
          for w in idx['words']:
              assert w[6] & 2, f"Missing audio bit {w[0]}"
              audio = root/'audio'/'uk'/(w[0]+'.mp3')
              assert audio.is_file() and audio.stat().st_size > 1000, f"Missing/empty MP3 {w[0]}"
          chunks = []
          for p in sorted((root/'entries').glob('*.json'), key=lambda p:int(p.stem)):
              chunks.extend(json.loads(p.read_text('utf-8')))
          assert len(chunks)==1813
          assert all(e['m'] & 2 for e in chunks)
          for w in (idx['words'][i] for i in [0,1,2,59,60,300,700,1200,1812]):
              path = root/'audio'/'uk'/(w[0]+'.mp3')
              probe = subprocess.check_output(
                  ['ffprobe','-v','error','-show_entries','stream=codec_name',
                   '-of','default=noprint_wrappers=1:nokey=1',str(path)], text=True
              ).strip()
              assert 'mp3' in probe, (path, probe)
          print('ALL_UYGHUR_AUDIO_VERIFIED', idx['voiced'], flush=True)
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Install and test original app
        working-directory: upstream
        run: |
          npm ci
          npm test
      - name: Build Uyghur edition using original React/WebGL/FSRS source
        working-directory: upstream
        run: npm run build
        env:
          ATLAS_BASE: /uyghur-word-atlas/
      - name: Build a root-path package for Netlify and other static hosts
        working-directory: upstream
        run: npm run build -- --outDir dist-netlify
        env:
          ATLAS_BASE: /
      - name: Attach code attribution and migration notes
        shell: bash
        run: |
          for out in dist dist-netlify; do
            cp upstream/LICENSE "upstream/$out/UPSTREAM_MIT_LICENSE.txt"
            cp upstream/UYGHUR_PORT_NOTICE.md "upstream/$out/UYGHUR_PORT_NOTICE.md"
          done
      - name: Upload built website for download
        uses: actions/upload-artifact@v4
        with:
          name: uyghur-atlas-website
          path: upstream/dist/
          retention-days: 30
      - name: Upload Netlify-ready root-path package
        uses: actions/upload-artifact@v4
        with:
          name: uyghur-atlas-netlify
          path: upstream/dist-netlify/
          retention-days: 30
      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/dist/
  publish:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
