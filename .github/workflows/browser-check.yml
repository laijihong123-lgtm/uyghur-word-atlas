name: Verify site works in a real browser
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/browser-check.yml"]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check website JavaScript and app render with headless Chromium
        shell: bash
        run: |
          npm install --no-save playwright
          node <<'JS'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ channel: "chrome", headless: true, args: ["--no-sandbox"] });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, locale: "zh-CN" });
            let errors = [];
            page.on("pageerror", x => errors.push(x.message));
            page.on("console", x => {if(x.type()==="error") errors.push("console "+x.text())});
            page.on("requestfailed", req => errors.push("request "+req.url()+" "+(req.failure()?.errorText||"")));
            const r = await page.goto("https://laijihong123-lgtm.github.io/uyghur-word-atlas/", {waitUntil:"networkidle", timeout:45000});
            await page.waitForTimeout(3000);
            console.log("STATUS",r.status());
            console.log("TITLE",await page.title());
            console.log("ROOT_HTML", (await page.locator("#root").innerText()).slice(0,1500));
            console.log("VISIBLE_TEXT", (await page.locator("body").innerText()).slice(0,1500));
            console.log("RUNTIME_ERRORS",errors.slice(0,30));
            const atlasRes = await page.request.get("https://laijihong123-lgtm.github.io/uyghur-word-atlas/atlas/index.json");
            const idx = await atlasRes.json();
            const words = idx.words || [];
            const uniqueForms = new Set(words.map(w => w[1]));
            const deferred = ["قۇمقېتىش","قېرى-چۆرىلەر","ئورتاق نەتىجە","ئۈندە-"];
            const firstChunk = await (await page.request.get("https://laijihong123-lgtm.github.io/uyghur-word-atlas/atlas/entries/0.json")).json();
            console.log("SOURCE_FIDELITY",JSON.stringify({cards:idx.count,uniqueForms:uniqueForms.size,first:firstChunk[0].w,firstGloss:firstChunk[0].senses[0].zh,groups:idx.cefr,deferredVisible:deferred.filter(x=>uniqueForms.has(x))}));
            if(idx.count!==1813 || words.length!==1813 || uniqueForms.size!==1813 || firstChunk[0].w!=="ئابزاس" || firstChunk[0].senses[0].zh!=="段；段落" || deferred.some(x=>uniqueForms.has(x)))throw Error("Published vocabulary differs from user's reviewed Excel");
            if(!(await page.locator("body").innerText()).includes("1,813"))throw Error("UI still shows old candidate count");
            if(idx.illustrated !== 861)throw Error("Illustration count is incorrect: "+idx.illustrated);
            const root = "https://laijihong123-lgtm.github.io/uyghur-word-atlas/";
            for(const id of ["tb0001","tb0002","tb0007","tb0010","tb0029","tb0049","tb0063","tb0413"]){
              const image = await page.request.get(root+"atlas/img/"+id+".webp");
              const data = await image.body();
              if(!image.ok() || data.length<1200 || data.toString("ascii",0,4)!=="RIFF")throw Error("Missing published image: "+id);
            }
            const ambiance = await page.request.get(root+"sfx/amb-stars.mp3");
            const ambientData = await ambiance.body();
            if(!ambiance.ok() || ambientData.length<100000)throw Error("Missing ambient sound file");
            await page.locator('button[aria-label="环境声"]').click({force:true});
            if(!(await page.locator("body").innerText()).includes("点击播放环境声"))throw Error("Mobile manual sound control missing");
            console.log("MEDIA_CHECK",JSON.stringify({illustrated:idx.illustrated,customGenerated:6,ambienceBytes:ambientData.length,manualPlayButton:true}));
            const sw = await page.request.get("https://laijihong123-lgtm.github.io/uyghur-word-atlas/sw.js");
            const swBody = await sw.text();
            console.log("SW_STATUS",sw.status(),"HAS_FETCH_HANDLER",swBody.includes('addEventListener("fetch"'),"SELF_UNREGISTER",swBody.includes("registration.unregister"));
            console.log("SW_REGISTRATIONS",await page.evaluate(async()=> (await navigator.serviceWorker.getRegistrations()).length));
            if((await page.locator("#root").innerText()).trim().length < 60 || errors.some(x=>/uncaught|not found|failed to fetch/i.test(x)) || !sw.ok || swBody.includes('addEventListener("fetch"'))process.exitCode=1;
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
